name: mail-test-hub

services:
  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_LABEL: Shared VPS test mail
      MP_UI_AUTH: ${MAIL_TEST_DASHBOARD_USER:?set MAIL_TEST_DASHBOARD_USER}:${MAIL_TEST_DASHBOARD_PASSWORD:?set MAIL_TEST_DASHBOARD_PASSWORD}
      MP_MAX_MESSAGES: ${MAIL_TEST_MAX_MESSAGES:-5000}
      MP_MAX_AGE: ${MAIL_TEST_MAX_AGE:-7d}
      MP_SMTP_ALLOWED_RECIPIENTS: ${MAIL_TEST_SMTP_ALLOWED_RECIPIENTS:?set MAIL_TEST_SMTP_ALLOWED_RECIPIENTS}
      MP_HIDE_DELETE_ALL_BUTTON: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
    volumes:
      - mailpit_data:/data
    ports:
      - 127.0.0.1:${MAIL_TEST_DASHBOARD_LOOPBACK_PORT:-59025}:8025
      - 127.0.0.1:${MAIL_TEST_SMTP_LOOPBACK_PORT:-59027}:1025
    networks:
      - mail-test-hub
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  gateway:
    build:
      context: ../..
      dockerfile: deploy/mail-test-hub/Dockerfile
    restart: unless-stopped
    environment:
      MAIL_TEST_GATEWAY_PORT: "8080"
      MAIL_TEST_GATEWAY_MAILPIT_URL: http://mailpit:8025
      MAIL_TEST_GATEWAY_MAILPIT_USER: ${MAIL_TEST_DASHBOARD_USER:?set MAIL_TEST_DASHBOARD_USER}
      MAIL_TEST_GATEWAY_MAILPIT_PASSWORD: ${MAIL_TEST_DASHBOARD_PASSWORD:?set MAIL_TEST_DASHBOARD_PASSWORD}
      MAIL_TEST_GATEWAY_APPS_JSON: ${MAIL_TEST_GATEWAY_APPS_JSON:?set MAIL_TEST_GATEWAY_APPS_JSON}
    ports:
      - 127.0.0.1:${MAIL_TEST_GATEWAY_LOOPBACK_PORT:-59026}:8080
    depends_on:
      - mailpit
    networks:
      - mail-test-hub
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  mail-test-hub:
    name: mail-test-hub
    internal: true

volumes:
  mailpit_data:
