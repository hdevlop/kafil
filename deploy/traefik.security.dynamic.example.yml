# Install this middleware in Dokploy Traefik's existing dynamic-file provider,
# then attach `kafil-security@file` to Kafil's existing HTTPS router. Do not
# create a second router for the same hostname.
http:
  middlewares:
    kafil-security:
      headers:
        contentTypeNosniff: true
        customFrameOptionsValue: DENY
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: camera=(), geolocation=(), microphone=()
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        # Preload is intentionally deferred until every HTTPS subdomain is
        # audited and the domain owner accepts the long-lived browser policy.
        stsPreload: false
        # The Next.js proxy owns CSP because its script nonce is unique per
        # request. An edge CSP here would overwrite that nonce and block the
        # framework scripts it authorizes. Keep every non-CSP browser header at
        # the edge so API and static responses retain the shared baseline.
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""
