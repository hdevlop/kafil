name: Verify, publish, and deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kafil-demo-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  IMAGE_NAME: ghcr.io/hdevlop/kafil
  NEXT_PUBLIC_FORM_FILL_ENABLED: "false"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      FRONTEND_URL: https://demo.example.invalid
      NAJM_AUTH_INTERNAL_URL: http://127.0.0.1:3000/api/auth/session/recover
      JWT_ACCESS_SECRET: build-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: build-only-refresh-secret-at-least-32-characters
      NAJM_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      NEXT_PUBLIC_FORM_FILL_ENABLED: "false"
      EMAIL_PROVIDER: console
      EMAIL_DEFAULT_FROM: no-reply@example.invalid
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Production build
        run: bun run build

  publish:
    name: Build and publish image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Set image creation time
        id: created
        run: echo "value=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          build-args: |
            NEXT_PUBLIC_FORM_FILL_ENABLED=false
            OCI_CREATED=${{ steps.created.outputs.value }}
            OCI_REVISION=${{ github.sha }}

  deploy:
    name: Deploy through Dokploy
    needs: publish
    runs-on: ubuntu-24.04
    environment: demo-vps
    permissions:
      contents: read
      packages: read
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          test -n "$DOKPLOY_DEPLOY_WEBHOOK"
          case "$DOKPLOY_DEPLOY_WEBHOOK" in
            "https://deploy.najmstack.com/"*)
              deploy_webhook="$DOKPLOY_DEPLOY_WEBHOOK"
              ;;
            "https://deploy.kafala360.ma/"*)
              deploy_webhook="https://deploy.najmstack.com/${DOKPLOY_DEPLOY_WEBHOOK#https://deploy.kafala360.ma/}"
              ;;
            *)
              echo "Dokploy webhook origin is not recognized." >&2
              exit 1
              ;;
          esac
          if [ -z "$DEPLOY_MESSAGE" ]; then
            DEPLOY_MESSAGE="Deploy ${GITHUB_SHA}"
          fi
          payload="$(
            jq -n \
              --arg ref "$GITHUB_REF" \
              --arg after "$GITHUB_SHA" \
              --arg message "$DEPLOY_MESSAGE" \
              '{ref: $ref, after: $after, head_commit: {message: $message}, commits: []}'
          )"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --data "$payload" \
            "$deploy_webhook"
